name: checks

# 三类检查：文档结构 / 契约与模板 / 仿真能起来
# 与 docs-site.yml 分开：这里只验证，不部署。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 链接 / 表格 / 排版
        run: node scripts/check-docs.mjs

  contracts:
    name: contracts & templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装校验依赖
        working-directory: checks
        run: npm install --no-audit --no-fund
      - name: Schema / 样例 / 基线 yaml / Issue 模板
        working-directory: checks
        run: node validate-contracts.mjs

  sim:
    name: sim smoke（6 秒闭环）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r sim/requirements.txt
      - name: 跑 6 秒闭环（无面板）
        run: python -m sim.main --baseline full --duration 6 --no-render
      - name: 日志必须可解析
        run: |
          ls -1 logs/*.jsonl
          grep -q '"event": "summary"' logs/*.jsonl
          grep -q '"event": "reflex_override"' logs/*.jsonl || echo "本次没有触发反射（合法，只做提示）"

  vla-probe:
    name: vla probe（离线，不需要模型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install --upgrade pip && python -m pip install -r sim/requirements.txt
      # 用进程内的假 Ollama（真 HTTP、真端口），所以 CI 不需要 GPU、不需要模型。
      # 注意：不要在这里写 heredoc —— bash 的结束符必须顶格，YAML block 里有缩进会失效。
      - name: 探针跑完并产出六项指标
        run: |
          python -m sim.test_vla_l4 --provider fake --scene stage1 --duration 12 --fast --no-render --report /tmp/vla.json
          python -c "import json;d=json.load(open('/tmp/vla.json'));ks=('M1_stale_adoption','M2_l2_closed_loop','M3_cross_layer','M4_preempt_residual','M5_transport','M6_physics');miss=[k for k in ks if k not in d];assert not miss,('缺指标',miss);assert d['M5_transport']['n']>0,'L4 一次请求都没发生';assert d['M2_l2_closed_loop']['chunks']>0,'L2 没产出动作块';print('M1',d['M1_stale_adoption'],'n_l4',d['M5_transport']['n'],'chunks',d['M2_l2_closed_loop']['chunks'])"
      - name: 假服务的故障必须被记到（超时或拒连，二者都算"端点坏了"）
        run: |
          python -m sim.test_vla_l4 --provider fake --fake-mode timeout --l4-timeout-ms 100 --l4-period 0.5 --scene stage1 --duration 6 --no-render --report /tmp/vla_to.json
          python -c "import json;d=json.load(open('/tmp/vla_to.json'));m=d['M5_transport'];print('timeouts',m['timeouts'],'conn',m['connection_errors'],'n',m['n']);assert m['timeouts']+m['connection_errors']>0,'假服务要么 hang 要么拒连，客户端必须至少记到一种'"
