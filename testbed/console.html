<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EA Console · L1–L4 具身自主栈</title>
  </head>
  <body>
    <div id="app">
      <header id="top">
        <div class="brand">
          <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div>
            <h1>EA // STACK <em>v0.2</em></h1>
            <p>L1 内感受 · L2 反射 · L3 调制 · L4 规划</p>
          </div>
        </div>
        <nav class="stages" id="stages"></nav>
        <div class="meta">
          <span id="clock">--:--:--</span>
          <button id="btn-body" title="胶囊（Rapier）↔ G1（MuJoCo 29-DOF）">身体：鲸鱼娘</button>
          <button id="btn-pause">暂停</button>
          <button id="btn-reset">重置</button>
        </div>
      </header>

      <main>
        <section id="stage">
          <canvas id="scene"></canvas>
          <div id="bubble" class="bubble hidden"></div>
          <div id="action" class="action-tag">待机</div>
          <div class="stage-caption">
            <span id="chapter">01</span>
            <div>
              <b id="chapter-title">L1 · 内感受</b>
              <p id="chapter-sub">饿、渴、体力、体温按 100 Hz 积分</p>
            </div>
          </div>
        </section>

        <aside id="side">
          <div class="cards">
            <div class="card"><span>待机漂移</span><b id="m-idle">— mm</b></div>
            <div class="card"><span>L4 往返</span><b id="m-sem">— ms</b></div>
            <div class="card"><span>控制周期</span><b id="m-ctl">10.0 ms</b></div>
          </div>

          <h2 class="panel-title">L1 身体状态 <em id="l1-src">100 Hz</em></h2>
          <div class="vitals">
            <div class="vital"><span>饥饿</span><div class="bar"><i id="v-hunger"></i></div><b id="v-hunger-n">0%</b></div>
            <div class="vital"><span>口渴</span><div class="bar"><i id="v-thirst"></i></div><b id="v-thirst-n">0%</b></div>
            <div class="vital"><span>体力</span><div class="bar"><i id="v-energy"></i></div><b id="v-energy-n">0%</b></div>
            <div class="vital"><span>体温</span><div class="bar"><i id="v-temp"></i></div><b id="v-temp-n">36.6°</b></div>
          </div>

          <h2 class="panel-title">L3 情绪 <em>只调制参数</em></h2>
          <div class="vitals">
            <div class="vital"><span>恐惧</span><div class="bar"><i id="a-fear"></i></div><b id="a-fear-n">5%</b></div>
            <div class="vital"><span>好奇</span><div class="bar"><i id="a-curiosity"></i></div><b id="a-curiosity-n">55%</b></div>
            <div class="vital"><span>疲劳</span><div class="bar"><i id="a-fatigue"></i></div><b id="a-fatigue-n">10%</b></div>
            <div class="vital"><span>舒适</span><div class="bar"><i id="a-comfort"></i></div><b id="a-comfort-n">—</b></div>
          </div>

          <div class="gauges">
            <div class="gauge">
              <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" class="bg"/><circle id="g1" cx="36" cy="36" r="30" class="fg"/></svg>
              <div><b id="g1v">0</b><span>需求压力</span></div>
            </div>
            <div class="gauge">
              <svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" class="bg"/><circle id="g2" cx="36" cy="36" r="30" class="fg alt"/></svg>
              <div><b id="g2v">0</b><span>计划年龄 ms</span></div>
            </div>
          </div>

          <div class="chat">
            <h2>L4 指令 <em id="l4-src">server 未连接</em></h2>
            <ul id="log"></ul>
            <form id="say">
              <input id="msg" placeholder="输入指令，例：去桌边 / 坐下 / 挥挥手" autocomplete="off" />
              <button>发送</button>
            </form>
          </div>

          <div class="strip">
            <div><span>L1 需求压力</span><div id="c1"></div></div>
            <div><span>L3 恐惧</span><div id="c2"></div></div>
            <div><span>L4 计划年龄</span><div id="c3"></div></div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/console/main.ts"></script>
  </body>
</html>
